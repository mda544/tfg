version: "3.8"

services:

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB:       ampacitygis
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ampacitygis"]      
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend        
    working_dir: /backend
    env_file:
      - ./backend/.env          
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   

  frontend:
    build:
      context: ./frontend       
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data: